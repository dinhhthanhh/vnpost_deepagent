services:
  chatbot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      HF_HOME: /data/cache/huggingface
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - chatbot_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  chatbot_data:
