apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnpost-agent-core
  namespace: vnpost-production
  labels:
    app.kubernetes.io/name: vnpost-agent-core
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: vnpost-deepagent
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vnpost-agent-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vnpost-agent-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent-core
          image: vnpost-registry.internal/vnpost-deepagent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vnpost-agent-config
            - secretRef:
                name: vnpost-agent-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
